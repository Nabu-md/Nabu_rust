<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nabu</title>
    <link rel="stylesheet" href="generated/tailwind.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0b1220;
        overflow: hidden;
      }
      /* Visible boot placeholder. Lives inside #main so Dioxus replaces it
         on mount. If it is still visible seconds after launch, the wasm
         module failed to load — this makes black-screen vs load-failure
         distinguishable by eye. */
      #boot-placeholder {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #93c5fd;
        background-color: #0b1220;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div id="boot-placeholder">
        <div>Loading Nabu&hellip;</div>
        <div style="font-size: 12px; color: #64748b;">
          If this message persists, the UI module failed to load.
        </div>
      </div>
    </div>
  </body>
</html>
