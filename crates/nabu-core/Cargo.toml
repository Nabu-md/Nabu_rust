[package]
name = "nabu-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Local Whisper (whisper.cpp) transcription is an opt-in capability: it
# compiles the vendored whisper.cpp C++ engine, which is heavy and can trip
# over platform toolchain issues (e.g. the macOS <filesystem> deployment
# target). Off by default so `nabu-core` builds cleanly everywhere; enable it
# to get real audio transcription. The WhisperProcessor / WhisperTranscriber
# degrade gracefully (error, no fabricated text) when disabled.
default = []
whisper = ["dep:whisper-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
regex = "1"

harper-core = { version = "2.7", default-features = false }

tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# File-based (rolling) log appenders are desktop-only — wasm/browser targets
# have no local filesystem, and tracing-appender does not compile there.
tracing-appender = "0.2"

# Filesystem watcher for the vault. `notify` only compiles on native targets
# (it wraps platform-specific kernel notification APIs); the watcher module
# is gated to `cfg(not(target_arch = "wasm32"))` accordingly.
notify = "8"

# tokio process/IO/net features are native-only (UNIX sockets, subprocesses).
# On wasm they pull in `mio::net`, which does not compile for
# wasm32-unknown-unknown. Features unify with the base tokio dependency above
# on native targets, so the desktop build is unchanged.
tokio = { version = "1", features = ["process", "io-util", "net", "io-std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# uuid's `v4` feature needs an explicit randomness source on wasm32-unknown-unknown.
# The `js` feature (Web Crypto via wasm-bindgen) is enabled only for wasm builds;
# native builds keep the default getrandom path via the top-level uuid dependency.
uuid = { version = "1", features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString", "objc2-core-foundation"] }
objc2-vision = { version = "0.3.2", features = ["VNDefines", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
whisper-rs = { version = "0.14.4", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util", "rt-multi-thread"] }
criterion = "0.5"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "graph_rebuild"
harness = false

[[bin]]
name = "nabu-mcp-server"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "acp-test-agent"
path = "src/bin/acp_test_agent.rs"
